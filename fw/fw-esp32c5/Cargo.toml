[package]
edition      = "2024"
name         = "fw-esp32c5"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "fw-esp32c5"
path = "./src/bin/main.rs"

[dependencies]
tinyol-core            = { path = "../../shared/tinyol-core" }
libm                   = "0.2"
esp-hal                = { version = "~1.2.2", features = ["esp32c5"] }
esp-println            = { version = "0.17.0", features = ["esp32c5"] }
esp-backtrace          = { version = "0.19.0", features = ["esp32c5", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c5"] }
critical-section       = "1.2.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'

[workspace]
