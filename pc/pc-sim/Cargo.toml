[package]
name = "pc-sim"
version = "0.1.0"
edition = "2021"
# Chương trình: pc-sim (thí nghiệm, mặc định), selftest và inspect_mat (src/bin/)
default-run = "pc-sim"

[dependencies]
tinyml-core = { path = "../../tinyml-core" }
# Giải nén zlib bên trong file .mat (thuần Rust)
miniz_oxide = "0.9"
# Cổng nối tiếp tới ESP32-C5 (chương trình stream); cùng thư viện espflash dùng. Tắt libudev (chỉ cần mở cổng)
serialport = { version = "4", default-features = false }

[dev-dependencies]
criterion = "0.5"
