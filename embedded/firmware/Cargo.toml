[package]
edition      = "2024"
name         = "firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c5"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c5"] }
critical-section = "1.2.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 3
panic         = "abort"
