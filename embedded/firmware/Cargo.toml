[package]
edition      = "2024"
name         = "firmware"
rust-version = "1.95"
version      = "0.1.0"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c5"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c5"] }
critical-section = "1.2.0"
# Log qua UART0; tắt default-features để tránh xung đột feature (theo nhánh rust-python-xor)
esp-println = { version = "0.18.0", default-features = false, features = ["esp32c5", "uart"] }
# Vùng nhớ P/Q/R, chính sách, lớp cuối: cùng mã với bộ mô phỏng PC
tinyml-core = { path = "../../tinyml-core" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 3
panic         = "abort"
