[package]
name = "embedded"
version = "0.1.0"
edition = "2021"

[dependencies]
tinyol-core = { path = "../shared/tinyol-core" }
esp-hal = { version = "1.2.2", features = ["esp32c5"] }
esp-println = { version = "0.17.0", features = ["esp32c5"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c5", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c5"] }
libm = "0.2"
